name: Qualitätssicherung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax, Regeln, Integration, Profile und Release prüfen
        run: python scripts/qa.py
      - name: CLI ohne Terminal prüfen
        run: python piuu.py --silent --ascii --demo 400

  web:
    name: Browserlogik und Download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Browser-Simulation prüfen
        run: node --test tests/web/*.test.js
      - name: JavaScript-Syntax prüfen
        run: node --check docs/assets/site.js
      - name: Download muss zum Quellstand passen
        run: |
          python scripts/build_download.py
          git diff --exit-code -- docs/downloads/piu-piu-python.zip
